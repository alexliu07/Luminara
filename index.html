<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luminara</title>
  </head>
  <style>
      *,
      *::before,
      *::after {
          box-sizing: border-box;
      }
      :root {
          --ui-scale: 1.25;
          --bg: #cccaca;        /* 页面背景 */
          --ink: #241e20;       /* 主文字 */
          --sub: #5f585b;       /* 次要文字 */
          --card: #e9e5e5;      /* 卡片背景 */
          --card-ink: #241e20;  /* 卡片文字 */
          --glass-bg: rgba(255,255,255,0.6);
          --tab-bg: rgba(255,255,255,0.4);
      }

      @media (prefers-color-scheme: dark) {
          :root {
              --bg: #17161a;
              --ink: #f2eff0;
              --sub: #a8a2a5;
              --card: #2a272b;
              --card-ink: #ece8ea;
              --glass-bg: rgba(50,50,50,0.5);
              --tab-bg: rgba(50,50,50,0.3);
          }
      }
      html {
          zoom: var(--ui-scale);
          scrollbar-width: none;/* Firefox */
          overscroll-behavior: none;
          background: var(--bg);
      }
      html::-webkit-scrollbar {
          display: none;              /* Chromium / WebView2 */
      }
      body{
          margin: 0;
          background: var(--bg);
          overscroll-behavior: none;
      }
  </style>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
