<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luminara</title>
  </head>
  <style>
      *,
      *::before,
      *::after {
          box-sizing: border-box;
      }
      :root {
          --ui-scale: 1.25;
          --bg: #e6e6e6;        /* 页面背景 */
          --ink: #241e20;       /* 主文字 */
          --sub: #5f585b;       /* 次要文字 */
          --card: #f0f0f0;      /* 卡片背景 */
          --card-ink: #241e20;  /* 卡片文字 */
          --glass-bg: rgba(255,255,255,0.6);
          --tab-bg: rgba(220,220,220,0.3);
          --option-bg: rgba(220,220,220,0.5);
          --input-bg: rgba(0,0,0,0.06);            /* 输入框填充：比卡片略深 */
          --input-border: rgba(0,0,0,0.16);        /* 常态边框 */
          --input-border-focus: rgba(0,0,0,0.38);  /* 聚焦边框 */
          --hero-title: rgba(0, 0, 0, 0.8);
          --hero-meta: rgba(0, 0, 0, 0.92);
      }

      @media (prefers-color-scheme: dark) {
          :root {
              --bg: #17161a;
              --ink: #f2eff0;
              --sub: #a8a2a5;
              --card: #2a272b;
              --card-ink: #ece8ea;
              --glass-bg: rgba(50,50,50,0.5);
              --tab-bg: rgba(50,50,50,0.3);
              --option-bg: rgba(0,0,0,0.3);
              --input-bg: rgba(255,255,255,0.10);
              --input-border: rgba(255,255,255,0.24);
              --input-border-focus: rgba(255,255,255,0.55);
              --hero-title: rgba(255, 255, 255, 0.8);
              --hero-meta: rgba(255, 255, 255, 0.92);
          }
      }
      html {
          zoom: var(--ui-scale);
          scrollbar-width: none;/* Firefox */
          overscroll-behavior: none;
          background: var(--bg);
      }
      html::-webkit-scrollbar {
          display: none;              /* Chromium / WebView2 */
      }
      body{
          margin: 0;
          background: var(--bg);
          overscroll-behavior: none;
      }
  </style>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
