<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luminara</title>
  </head>
  <style>
      body{
          margin: 0;
      }
      :root {
          --bg: #cccaca;        /* 页面背景 */
          --ink: #241e20;       /* 主文字 */
          --sub: #5f585b;       /* 次要文字 */
          --card: #e9e5e5;      /* 卡片背景 */
          --card-ink: #241e20;  /* 卡片文字 */
          --white: #fff;
          --tabbar-bg: #ececec;
      }

      @media (prefers-color-scheme: dark) {
          :root {
              --bg: #17161a;
              --ink: #f2eff0;
              --sub: #a8a2a5;
              --card: #2a272b;
              --card-ink: #ece8ea;
              --tabbar-bg: #2f2c30;
          }
      }
  </style>

  <body>
    <div id="app"></div>

  </body>
