# 构建 Android 安装包（APK + AAB）
# 触发：推 v* 标签 → 构建并加入 Draft Release；手动 Run workflow → 只构建并上传产物
#
# Release 签名（可选）——在仓库 Settings → Secrets and variables → Actions 中配置：
#   ANDROID_KEYSTORE_BASE64    release.jks 的 base64（单行）
#   ANDROID_KEYSTORE_PASSWORD  keystore 密码
#   ANDROID_KEY_ALIAS          密钥别名（默认 upload）
#   ANDROID_KEY_PASSWORD       密钥密码（不填则同 keystore 密码）
# 未配置 ANDROID_KEYSTORE_BASE64 时自动构建 debug APK（debug 证书签名，可直接安装）
name: 构建 Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 同一引用重复触发时取消上一次，避免排队等
concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 建 Release 需要写权限
    env:
      # AGP 9.3 的默认 NDK；Tauri 2.12 模板使用 compileSdk 37
      NDK_VERSION: 28.2.13676358
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 不用 setup-android：v3 会执行 `sdkmanager tools`，新版仓库已移除该包。
      # 托管 runner 已预装 SDK，直接用其 cmdline-tools 里的 sdkmanager。
      - name: 安装 SDK 平台 / Build Tools / NDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -n 1)"
          echo "使用 $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 安装前端依赖
        run: npm ci

      # gen/android 未入库时在 CI 现生成；已入库则跳过
      - name: 生成 Android 工程
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npm run tauri android init -- --ci --skip-targets-install
          fi

      # Tauri 生成的 build.gradle.kts 默认没有 release 签名配置，这里注入一份
      - name: 注入 Release 签名配置
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src-tauri/gen/android/app/build.gradle.kts")
          s = p.read_text()
          # runner 仓库还没有 API 37，降到 36；targetSdk 不能高于 compileSdk
          s = s.replace("compileSdk = 37", "compileSdk = 36")
          s = s.replace("targetSdk = 37", "targetSdk = 36")

          if "import java.util.Properties" not in s:
              s = "import java.util.Properties\n" + s

          if "signingConfigs {" not in s:
              signing = '''    signingConfigs {
                  create("release") {
                      val propFile = rootProject.file("keystore.properties")
                      if (propFile.exists()) {
                          val props = Properties().apply { propFile.inputStream().use { load(it) } }
                          storeFile = file(props["storeFile"] as String)
                          storePassword = props["storePassword"] as String
                          keyAlias = props["keyAlias"] as String
                          keyPassword = props["keyPassword"] as String
                      }
                  }
              }
          '''
              s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)

          if 'signingConfig = signingConfigs.getByName("release")' not in s:
              s = s.replace(
                  'getByName("release") {',
                  'getByName("release") {\n'
                  '            if (rootProject.file("keystore.properties").exists()) {\n'
                  '                signingConfig = signingConfigs.getByName("release")\n'
                  '            }',
                  1,
              )

          assert "signingConfigs {" in s, "签名配置注入失败：Android 模板结构已变化"
          p.write_text(s)
          PY

      - name: 写入签名文件
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          KS="$GITHUB_WORKSPACE/src-tauri/gen/android/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$KS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=${ANDROID_KEY_ALIAS:-upload}
          keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}
          EOF

      - name: 构建 Release APK / AAB
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: npm run tauri android build -- --apk --aab --target aarch64

      - name: 构建 Debug APK（未配置签名）
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: npm run tauri android build -- --debug --apk --target aarch64

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: luminara-android-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

      - name: 发布 Draft Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab