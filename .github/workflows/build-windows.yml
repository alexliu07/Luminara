# 构建 Windows 安装包（NSIS 安装器 .exe + MSI）
# 触发：推 v* 标签 → 构建并建 Draft Release；手动 Run workflow → 只构建并传产物
name: 构建 Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 同一引用重复触发时取消上一次，避免排队等
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write        # 建 Release 需要写权限
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm           # 按 package-lock.json 缓存 ~/.npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 缓存 Tauri 打包工具（NSIS / WiX）
        uses: actions/cache@v4
        with:
          path: ${{ runner.localappdata }}\tauri
          key: tauri-tools-windows

      - name: 安装前端依赖
        run: npm ci

      # 会依次跑 beforeBuildCommand（vite build）→ cargo build --release → 打包 NSIS/MSI
      - name: 构建安装包
        run: npm run tauri build

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: luminara-windows-x64-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: 发布 Draft Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
